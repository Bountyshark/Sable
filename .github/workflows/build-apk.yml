name: Build Tauri Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build APK from"
        required: true
        default: "main"
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "29.0.14206865"

      - name: Install JS dependencies
        run: |
          sed -i 's|https://mirror2.chabokan.net/npm|https://registry.npmjs.org|g' pnpm-lock.yaml
          sed -i 's|https://npm.chabokan.net|https://registry.npmjs.org|g' pnpm-lock.yaml
          pnpm config set registry https://registry.npmjs.org/
          echo "registry=https://registry.npmjs.org/" > .npmrc
          pnpm install --no-frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

      - name: Configure Gradle properties with debug
        run: |
          mkdir -p $HOME/.gradle
          cat > $HOME/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=false
          org.gradle.configuration-cache=false
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.logging.level=debug
          org.gradle.debug=false
          EOF

      - name: Remove old Android project
        run: rm -rf src-tauri/gen/android

      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      - name: Build Android APK with full debug output
        run: |
          export TAURI_ANDROID_SDK_ROOT=$ANDROID_HOME
          export TAURI_ANDROID_NDK_HOME=$NDK_HOME
          export RUST_BACKTRACE=full
          export RUST_LOG=debug
          pnpm tauri android build --debug -- \
            --warning-mode all \
            --info \
            --debug \
            2>&1 | tee build-full.log
        continue-on-error: true

      - name: Show Gradle problems report
        if: always()
        run: |
          if [ -f "src-tauri/gen/android/build/reports/problems/problems-report.html" ]; then
            echo "=== GRADLE PROBLEMS REPORT ==="
            cat src-tauri/gen/android/build/reports/problems/problems-report.html
          fi

      - name: Show last 500 lines of build output
        if: always()
        run: |
          echo "=== LAST 500 LINES OF BUILD OUTPUT ==="
          tail -500 build-full.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log

      - name: Upload gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: src-tauri/gen/android/build/reports/

      - name: Locate and rename APK
        id: apk
        run: |
          set -e
          APK_PATH=$(find src-tauri/.gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          
          REF_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          VERSION=$(grep -m 1 '^version = "' src-tauri/Cargo.toml | cut -d'"' -f2)
          NEW_NAME="tauri-${VERSION}-${SAFE_REF}.apk"
          mv "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
