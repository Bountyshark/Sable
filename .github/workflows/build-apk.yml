name: Build Tauri Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build APK from"
        required: true
        default: "main"
        type: string

  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # ============================================================
      # PNPM
      # IMPORTANT:
      # Do NOT specify version here because package.json already
      # defines packageManager: pnpm@x.x.x
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ============================================================
      # Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ============================================================
      # Java
      # ============================================================
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ============================================================
      # Rust
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ============================================================
      # Rust Android Targets
      # ============================================================
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      # ============================================================
      # Android SDK + NDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "29.0.14206865"

      # ============================================================
      # Export NDK_HOME manually
      # setup-android installs the NDK but may not export NDK_HOME
      # ============================================================
      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # ============================================================
      # Verify Android environment
      # ============================================================
      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"

          echo "=== SDK ROOT ==="
          ls -la $ANDROID_HOME

          echo "=== AVAILABLE NDKS ==="
          ls -la $ANDROID_HOME/ndk || true

          echo "=== SELECTED NDK ==="
          ls -la $NDK_HOME || true

      # ============================================================
      # Install JS dependencies
      # ============================================================
      - name: Install JS dependencies
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        run: |
          sed -i 's|https://mirror2.chabokan.net/npm|https://registry.npmjs.org|g' pnpm-lock.yaml || true
          sed -i 's|https://npm.chabokan.net|https://registry.npmjs.org|g' pnpm-lock.yaml || true

          pnpm config set registry https://registry.npmjs.org/

          echo "registry=https://registry.npmjs.org/" > .npmrc

          pnpm install --no-frozen-lockfile

      # ============================================================
      # Configure Gradle
      # ============================================================
      - name: Configure Gradle properties
        run: |
          mkdir -p $HOME/.gradle

          cat > $HOME/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=false

          android.useAndroidX=true
          android.enableJetifier=true

          kotlin.incremental=false
          org.gradle.daemon=false
          EOF

      # ============================================================
      # Clean old generated Android project
      # Tauri v2 uses .gen not gen
      # ============================================================
      - name: Remove old Android project
        run: rm -rf src-tauri/.gen/android

      # ============================================================
      # Initialize Android project
      # ============================================================
      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      # ============================================================
      # Verify generated structure
      # ============================================================
      - name: Verify generated Android project
        run: |
          echo "=== GENERATED STRUCTURE ==="
          find src-tauri/.gen -maxdepth 3 -type d || true

      # ============================================================
      # Build APK
      # IMPORTANT:
      # Use env: block instead of inline export
      # ============================================================
      - name: Build Android APK
        run: |
          pnpm tauri android build --debug 2>&1 | tee build-full.log
        env:
          TAURI_ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          TAURI_ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          RUST_BACKTRACE: full
          RUST_LOG: debug

      # ============================================================
      # Show logs if build fails
      # ============================================================
      - name: Show last 500 lines of build output
        if: failure()
        run: |
          echo "=== LAST 500 LINES OF BUILD OUTPUT ==="
          tail -500 build-full.log || true

      # ============================================================
      # Upload build log
      # ============================================================
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log
          if-no-files-found: ignore

      # ============================================================
      # Upload Gradle reports
      # ============================================================
      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            src-tauri/.gen/android/build/reports/
            src-tauri/.gen/android/app/build/reports/
          if-no-files-found: ignore

      # ============================================================
      # Locate APK
      # ============================================================
      - name: Locate and rename APK
        id: apk
        run: |
          set -e

          APK_PATH=$(find src-tauri/.gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi

          REF_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          VERSION=$(grep -m 1 '^version = "' src-tauri/Cargo.toml | cut -d'"' -f2)

          NEW_NAME="tauri-${VERSION}-${SAFE_REF}.apk"

          mv "$APK_PATH" "$NEW_NAME"

          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      # ============================================================
      # Upload APK
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_path }}

  # ============================================================
  # Release Job
  # ============================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
