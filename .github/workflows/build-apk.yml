name: Build Tauri Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build APK from"
        required: true
        default: "main"
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # This forces the action to actually download and expose the NDK
          ndk-version: "29.0.14206865"

      - name: Install JS dependencies (Rewriting Mirror URLs)
        run: |
          # Automatically replace all mirror domains inside the lockfile text dynamically
          sed -i 's|https://mirror2.chabokan.net/npm|https://registry.npmjs.org|g' pnpm-lock.yaml
          sed -i 's|https://npm.chabokan.net|https://registry.npmjs.org|g' pnpm-lock.yaml
          
          # Force the environment baseline configs
          pnpm config set registry https://registry.npmjs.org/
          echo "registry=https://registry.npmjs.org/" > .npmrc
          
          # Install using the newly cleaned lockfile
          pnpm install --no-frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      - name: Configure Gradle to use compilerOptions
        run: |
          # Create a gradle.properties file to set build options
          mkdir -p src-tauri/.gradle
          cat > src-tauri/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          # Update build.gradle.kts to use new compilerOptions DSL
          if [ -f "src-tauri/gen/android/app/build.gradle.kts" ]; then
            sed -i 's/kotlinOptions {/compilerOptions {/g' src-tauri/gen/android/app/build.gradle.kts
            sed -i 's/jvmTarget = "/jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_/g' src-tauri/gen/android/app/build.gradle.kts
          fi

      - name: Fix deprecated Gradle exec calls
        run: |
          if [ -f "src-tauri/gen/android/buildSrc/src/main/java/moe/sable/client/kotlin/BuildTask.kt" ]; then
            # Replace deprecated exec() with execProcess()
            sed -i 's/\.exec(/\.exec {/g' src-tauri/gen/android/buildSrc/src/main/java/moe/sable/client/kotlin/BuildTask.kt
          fi

      - name: Build Android APK
        run: TAURI_ANDROID_SDK_ROOT=$ANDROID_HOME TAURI_ANDROID_NDK_HOME=$NDK_HOME pnpm tauri android build --debug
        env:
          # Additional Gradle configuration for stable builds
          ORG_GRADLE_PROJECT_ANDROID_GRADLE_PLUGIN_VERSION: "8.1.0"

      - name: Locate and rename APK
        id: apk
        run: |
          set -e
          # Fixed: Added the dot to .gen to account for Tauri's hidden directory layout
          APK_PATH=$(find src-tauri/.gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            # Fallback search paths if .gen directory naming differs
            APK_PATH=$(find src-tauri -path "*/app/build/outputs/apk*" -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "APK not found in expected locations"
            find src-tauri -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          REF_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          VERSION=$(grep -m 1 '^version = "' src-tauri/Cargo.toml | cut -d'"' -f2)
          NEW_NAME="tauri-${VERSION}-${SAFE_REF}.apk"
          mv "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
