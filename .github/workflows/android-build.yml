```yaml
name: Build Tauri Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build APK from"
        required: true
        default: "main"
        type: string

  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # ============================================================
      # PNPM
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ============================================================
      # Node.js 24
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ============================================================
      # Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ============================================================
      # Rust
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ============================================================
      # Android Rust targets
      # ============================================================
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      # ============================================================
      # Android SDK + NDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "29.0.14206865"

      # ============================================================
      # Export NDK path
      # ============================================================
      - name: Export Android environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "TAURI_ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "TAURI_ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # ============================================================
      # Verify Android environment
      # ============================================================
      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"

          echo "=== SDK ==="
          ls -la $ANDROID_HOME

          echo "=== NDK ==="
          ls -la $ANDROID_HOME/ndk
          ls -la $NDK_HOME

      # ============================================================
      # Install JS dependencies
      # ============================================================
      - name: Install JS dependencies
        env:
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        run: |
          sed -i 's|https://mirror2.chabokan.net/npm|https://registry.npmjs.org|g' pnpm-lock.yaml || true
          sed -i 's|https://npm.chabokan.net|https://registry.npmjs.org|g' pnpm-lock.yaml || true

          pnpm config set registry https://registry.npmjs.org/

          echo "registry=https://registry.npmjs.org/" > .npmrc

          pnpm install --no-frozen-lockfile

      # ============================================================
      # Configure Gradle
      # ============================================================
      - name: Configure Gradle
        run: |
          mkdir -p $HOME/.gradle

          cat > $HOME/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=false
          org.gradle.configuration-cache=false

          android.useAndroidX=true
          android.enableJetifier=true

          kotlin.incremental=false
          org.gradle.daemon=false
          EOF

      # ============================================================
      # Remove stale Android + Gradle caches
      # ============================================================
      - name: Remove stale Android + Gradle caches
        run: |
          rm -rf src-tauri/gen
          rm -rf src-tauri/.gen
          rm -rf src-tauri/target

          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper

      # ============================================================
      # Initialize Android project
      # ============================================================
      - name: Initialize Android project
        run: pnpm tauri android init

      # ============================================================
      # Force Kotlin 2.2.0 everywhere
      # ============================================================
      - name: Force Kotlin 2.2.0 everywhere
        run: |
          find src-tauri/gen/android -name "*.gradle.kts" -type f -exec \
            sed -i 's/kotlin-gradle-plugin:1\.[0-9.]*/kotlin-gradle-plugin:2.2.0/g' {} +

          find src-tauri/gen/android -name "*.gradle.kts" -type f -exec \
            sed -i 's/kotlin("android") version "1\.[0-9.]*"/kotlin("android") version "2.2.0"/g' {} +

      # ============================================================
      # Show Kotlin versions
      # ============================================================
      - name: Show Kotlin versions
        run: |
          grep -R "kotlin" src-tauri/gen/android || true

      # ============================================================
      # Build APK
      # ============================================================
      - name: Build Android APK
        run: |
          pnpm tauri android build --debug 2>&1 | tee build-full.log
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug

      # ============================================================
      # Show build log on failure
      # ============================================================
      - name: Show last 500 lines
        if: failure()
        run: |
          tail -500 build-full.log || true

      # ============================================================
      # Upload full build log
      # ============================================================
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log
          if-no-files-found: ignore

      # ============================================================
      # Upload Gradle reports
      # ============================================================
      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: src-tauri/gen/android/build/reports/
          if-no-files-found: ignore

      # ============================================================
      # Locate APK
      # ============================================================
      - name: Locate APK
        id: apk
        run: |
          set -e

          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi

          REF_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          VERSION=$(grep -m 1 '^version = "' src-tauri/Cargo.toml | cut -d'"' -f2)

          NEW_NAME="tauri-${VERSION}-${SAFE_REF}.apk"

          mv "$APK_PATH" "$NEW_NAME"

          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      # ============================================================
      # Upload APK
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
